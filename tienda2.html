<script>
const $=id=>document.getElementById(id);
const N=s=>s.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase();
const U="https://images.unsplash.com/";

const B=[
["Playera Blanca","Playera",299,15,0,"photo-1523381210434-271e8be1f52b","Playeras y tops","👕"],
["Sudadera Gris","Sudadera",649,8,1,"photo-1578681994506-b8f463449011","Sudaderas y hoodies","🧥"],
["Jeans Azul","Jeans",799,10,0,"photo-1541099649105-f69ad21f3246","Pantalones y shorts","👖"],
["Chaqueta Negra","Chaqueta",999,6,1,"photo-1551028719-00167b16eac5","Chaquetas y abrigos","🧥"],
["Vestido Negro","Vestido",699,7,0,"photo-1566174053879-31528523f8ae","Vestidos y faldas","👗"],
["Falda Negra","Falda",499,9,1,"photo-1583496661160-fb5886a13d27","Vestidos y faldas","👗"],
["Pantalón Cargo Beige","Pantalón cargo",749,12,0,"photo-1515886657613-9f3515b0c78f","Pantalones y shorts","👖"],

const BR=["Nova","Urbano","Aztek","Lumen","Kappa","Orbe","Zenit","Brío"],CO=["negro","blanco","azul","gris","rojo","verde"],TA=["XS","S","M","L","XL"];

function completar(ctx,tk){let base=productos,cu=ctx.trim();
if(cu){base=hit(cu);if(!base.length){const c=palabras(cu).map(fix).join(" ");const b2=c?hit(c):[];if(b2.length){base=b2;cu=c}}}

function cambiarCantidad(id,d){const c=usuarios[usuarioActual].carrito;if(d>0){if(stock[id]<=0){alert("No quedan unidades.");return}c[id]++;stock[id]--}else{if(c[id]<=1)delete c[id];else c[id]--;stock[id]++}guardarUsuarios();guardarStock();mostrarProductos();mostrarCarrito()}
function eliminarProducto(id){const c=usuarios[usuarioActual].carrito;stock[id]+=c[id];delete c[id];guardarUsuarios();guardarStock();mostrarProductos();mostrarCarrito()}
function abrirCarrito(){if(!comprobarLogin())return;$("carritoModal").classList.add("activo");mostrarCarrito()}
function mostrarCarrito(){const co=$("carritoItems"),re=$("resumenCompra");$("cuentaInfo").innerHTML="👤 Cuenta activa: <strong>"+usuarioActual+"</strong>";
const el=Object.entries(usuarios[usuarioActual].carrito);if(!el.length){co.innerHTML='<div class="vacio">🛒 Tu carrito está vacío.</div>';re.innerHTML="";return}
let sub=0;co.innerHTML="";el.forEach(([id,q])=>{const p=P(+id),t=p.precio*q;sub+=t;const d=document.createElement("div");d.className="carrito-item";
d.innerHTML=`<div class="carrito-icono">${p.emoji}${img(p)}</div><div class="carrito-info"><strong>${p.nombre}</strong><small>${dinero(p.precio)} cada uno</small><small>${p.importado?"🌎 Importado":"🇲🇽 Nacional"}</small>
<div class="cantidad"><button onclick="cambiarCantidad(${p.id},-1)">−</button><span>${q}</span><button onclick="cambiarCantidad(${p.id},1)">+</button></div><button class="eliminar" onclick="eliminarProducto(${p.id})">Eliminar</button></div><strong>${dinero(t)}</strong>`;co.appendChild(d)});
const env=sub<ENVIO_GRATIS_DESDE?COSTO_ENVIO:0;
re.innerHTML=(env===0?`<div class="envio-gratis">🚚 ¡Tienes envío GRATIS!</div>`:`<div class="aviso-envio">🚚 Envío gratis en compras superiores a ${dinero(ENVIO_GRATIS_DESDE)}.<br><br>Te faltan <strong>${dinero(ENVIO_GRATIS_DESDE-sub)}</strong> para obtener envío gratis.</div>`)+
`<div class="linea"><span>Subtotal:</span><strong>${dinero(sub)}</strong></div><div class="linea envio"><span>🚚 Envío:</span><strong>${env?dinero(env):"GRATIS"}</strong></div><div class="linea total"><span>Total:</span><strong>${dinero(sub+env)}</strong></div>`}
function finalizarCompra(){if(!usuarioActual)return;const c=usuarios[usuarioActual].carrito;if(!Object.keys(c).length){alert("🛒 Tu carrito está vacío.");return}if(!confirm("¿Deseas finalizar tu compra?"))return;
alert("✅ ¡Compra realizada correctamente!\n\nTu pedido será enviado a tu domicilio.");usuarios[usuarioActual].carrito={};guardarUsuarios();mostrarProductos();mostrarCarrito()}
/* ===== detalle ===== */
function detalle(id){const p=P(id),v=obtenerValoracion(p),c=stock[id];
$("detalle").innerHTML=`<div class="imagen-producto" style="height:280px;border-radius:12px;cursor:default">${p.emoji}${img(p)}</div><h2 style="margin:16px 0 6px">${p.nombre}</h2>
<div class="estrellas">${generarEstrellas(v.promedio)} <span class="promedio">${v.promedio.toFixed(1)} · ${v.cantidad} reseñas</span></div>
<div class="precio" style="margin:8px 0">${dinero(p.precio)}${p.antes?`<s>${dinero(p.antes)}</s>`:""}</div>
<p style="line-height:1.5;margin-bottom:10px">${p.texto}</p>
<p style="color:#666;font-size:14px;line-height:1.7">Categoría: ${p.cat}<br>Marca: ${p.marca} · ${p.importado?"🌎 Importado":"🇲🇽 Nacional"}<br>Tallas: ${p.tallas.join(", ")}<br>🚚 Envío: ${precioEnvio(p)} · Llega en ${p.dias} día(s)<br>Stock: ${c}</p>
<button class="agregar" style="margin-top:16px" onclick="agregarCarrito(${id})" ${c?"":"disabled"}>${c?"Agregar al carrito":"Agotado"}</button>`;$("detalleModal").classList.add("activo")}
/* ===== reseñas ===== */
let prodRes=null,estSel=0;
function abrirResenas(id){prodRes=id;estSel=0;$("tituloResenas").textContent="⭐ Reseñas de "+P(id).nombre;$("resenasModal").classList.add("activo");$("textoResena").value="";$("mensajeResena").textContent="";selEstrellas(0);mostrarResenas(id)}
function selEstrellas(n){estSel=n;document.querySelectorAll("#selectorEstrellas button").forEach((b,i)=>b.classList.toggle("seleccionada",i<n))}
const escaparHTML=t=>{const d=document.createElement("div");d.textContent=t;return d.innerHTML};
function mostrarResenas(id){const l=resenas[id]||[],v=obtenerValoracion(P(id)),li=$("listaResenas");
$("resumenEstrellas").innerHTML=`<div style="text-align:center"><div class="estrellas" style="font-size:30px">${generarEstrellas(v.promedio)}</div><strong style="font-size:22px">${v.promedio.toFixed(1)} / 5</strong><p>Basado en ${v.cantidad} reseñas</p></div>`;
if(!l.length){li.innerHTML='<div class="sin-resenas">Aún no hay comentarios. ¡Sé el primero en escribir uno! ⭐</div>';return}
li.innerHTML="";l.slice().reverse().forEach(r=>{const d=document.createElement("div");d.className="resena";
d.innerHTML=`<div class="resena-cabecera"><span class="resena-usuario">👤 ${escaparHTML(r.usuario)}</span><span class="resena-fecha">${new Date(r.fecha).toLocaleDateString("es-MX")}</span></div><div class="resena-estrellas">${generarEstrellas(r.estrellas)}</div><div class="resena-texto">${escaparHTML(r.comentario)}</div>`+
(usuarioActual&&r.usuario===usuarioActual?`<button class="eliminar-resena" onclick="eliminarResena(${id},${l.indexOf(r)})">🗑️ Eliminar mi reseña</button>`:"");li.appendChild(d)})}
function guardarResena(e){e.preventDefault();if(!comprobarLogin())return;const m=$("mensajeResena");
if(!estSel){m.className="mensaje error";m.textContent="⭐ Selecciona una valoración.";return}
const c=$("textoResena").value.trim();if(!c){m.className="mensaje error";m.textContent="📝 Escribe un comentario.";return}
resenas[prodRes]=resenas[prodRes]||[];if(resenas[prodRes].some(r=>r.usuario===usuarioActual)){m.className="mensaje error";m.textContent="❌ Ya has reseñado este producto.";return}
resenas[prodRes].push({usuario:usuarioActual,estrellas:estSel,comentario:c,fecha:new Date().toISOString()});guardarResenas();m.className="mensaje exito";m.textContent="✅ ¡Reseña publicada!";$("textoResena").value="";selEstrellas(0);mostrarResenas(prodRes);mostrarProductos()}
function eliminarResena(id,i){const l=resenas[id];if(!usuarioActual||!l||!l[i]||l[i].usuario!==usuarioActual)return;if(!confirm("¿Quieres eliminar tu reseña?"))return;l.splice(i,1);if(!l.length)delete resenas[id];guardarResenas();mostrarResenas(id);mostrarProductos()}
const irProductos=()=>$("productosSection").scrollIntoView({behavior:"smooth"});
["authModal","carritoModal","resenasModal","detalleModal"].forEach(id=>$(id).addEventListener("click",function(e){if(e.target===this)cerrarModal(id)}));
if(usuarioActual&&!usuarios[usuarioActual])usuarioActual=null;
mostrarProductos();actualizarCuenta();
</script></body></html>
